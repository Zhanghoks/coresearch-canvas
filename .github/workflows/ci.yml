name: CI

# PR 和 main 都跑。这是仓库第一个会执行 typecheck / test 的 workflow——
# 在此之前镜像是盲构建的，agent-api 的 typecheck 已经累积到 47 个错误没人发现。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-api:
    uses: ./.github/workflows/agent-api-ci.yml

  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: web
        run: bun test

      - name: Build
        working-directory: web
        # 这是 web 的真实 gate：Vercel 也是跑 vite build，它不做类型检查。
        # 注意 web/vite.config.ts 会读 ../VERSION 并 alias 到 ../canvas-agent/src，
        # 所以必须在完整 checkout 下构建，不能只带 web/ 目录。
        run: bun run build

      - name: Typecheck（非阻断）
        working-directory: web
        # web 在 main 上有 43 个存量类型错误（集中在 src/pages/canvas/project.tsx 等画布代码）。
        # 清理它们与本次部署改造无关，且相关文件正在重构中，所以先只上报不阻断。
        # 清零之后请删掉 continue-on-error，让它变成真正的 gate。
        continue-on-error: true
        run: bun run typecheck

  migration-guard:
    name: Migration 提醒
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查是否新增 migration
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          added="$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" -- 'supabase/migrations/*.sql' || true)"
          if [ -z "$added" ]; then
            echo "本次没有新增 migration。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## ⚠️ 本次包含新增 migration"
            echo
            echo '```'
            echo "$added"
            echo '```'
            echo
            echo "合并到 main 后，部署流水线的 migrate job 会先执行这些 migration，再发布后端。"
            echo "请确认它们只做向前兼容的加法（见 \`supabase/README.md\`），且已在非生产项目跑过 RLS 验收。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::本次包含新增 migration，合并后会自动执行到生产库"
