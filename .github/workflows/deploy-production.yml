name: Deploy production

# main 更新 → CI → 数据库 migration → 构建 agent-api 运行包推 GHCR（sha-<commit> + main）
# → 服务器上的 updater 自己拉取并切换 → 这里轮询公网 /health，断言 version 是本次 commit。
#
# 生产机（ebcloud 容器实例）的入站 SSH 走中转、经常断线，所以 CI 不 SSH 进服务器，
# 只负责把 :main 指向新版本。服务器侧逻辑见 deploy/huabei/。

on:
  push:
    branches: [main]
    paths:
      - "agent-api/**"
      - "supabase/**"
      - "deploy/huabei/**"
      - "VERSION"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/agent-api-ci.yml"
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "回滚：填已发布过的 sha-<commit>，会把 :main 指回它。留空则正常构建当前 commit"
        required: false
        type: string

permissions:
  contents: read
  packages: write

# 串行化：连续 push 时不会有两个发布同时改 :main 或同时跑 migration。
# cancel-in-progress 必须是 false —— 中途取消 migration 会留下不确定的数据库状态。
concurrency:
  group: coresearch-production
  cancel-in-progress: false

env:
  BUNDLE_REPO: ghcr.io/zhanghoks/coresearch-agent-api-bundle
  ORAS_VERSION: 1.3.4

jobs:
  ci:
    if: inputs.rollback_tag == ''
    uses: ./.github/workflows/agent-api-ci.yml

  migrate:
    name: 数据库 migration
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否已接入
        id: gate
        run: |
          if [ "${{ vars.SUPABASE_MIGRATIONS_ENABLED }}" != "true" ]; then
            echo "::warning::SUPABASE_MIGRATIONS_ENABLED 不是 true，本次不执行 migration。开启步骤见 supabase/README.md。"
            echo "migration：**未接入 CI，已跳过**（见 supabase/README.md）" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 2.117.0

      - name: supabase db push
        if: steps.gate.outputs.enabled == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Environment production 缺少 Secret SUPABASE_DB_URL"; exit 1; }
          {
            echo "### 待执行 migration"
            echo '```'
            supabase db push --dry-run --db-url "$SUPABASE_DB_URL" 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          supabase db push --db-url "$SUPABASE_DB_URL"

  bundle:
    name: 构建并发布运行包
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    outputs:
      rev: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: agent-api/package-lock.json

      - name: 构建 bundle
        env:
          GIT_SHA: ${{ github.sha }}
        run: deploy/huabei/build-bundle.sh "$RUNNER_TEMP/agent-api.tar.gz"

      # setup-oras action 内置的版本表跟不上发布，直接装官方 release（与 deploy/huabei/install.sh 同一版本）。
      - name: 安装 oras
        run: |
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" |
            sudo tar -xz -C /usr/local/bin oras
          oras version

      - name: 推送到 GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "$RUNNER_TEMP"
          oras push "$BUNDLE_REPO:sha-$GITHUB_SHA" \
            --artifact-type application/vnd.coresearch.agent-api.bundle \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            agent-api.tar.gz:application/gzip
          # :main 是服务器 updater 跟随的指针，最后再移动它。
          oras tag "$BUNDLE_REPO:sha-$GITHUB_SHA" main
          echo "发布 \`$BUNDLE_REPO:sha-$GITHUB_SHA\`，:main 已指向它" >> "$GITHUB_STEP_SUMMARY"


  rollback:
    name: 回滚 :main
    if: inputs.rollback_tag != ''
    runs-on: ubuntu-latest
    environment: production
    outputs:
      rev: ${{ steps.retag.outputs.rev }}
    steps:
      # setup-oras action 内置的版本表跟不上发布，直接装官方 release（与 deploy/huabei/install.sh 同一版本）。
      - name: 安装 oras
        run: |
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" |
            sudo tar -xz -C /usr/local/bin oras
          oras version

      - id: retag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.rollback_tag }}
        run: |
          set -euo pipefail
          case "$TAG" in sha-*) ;; *) echo "::error::rollback_tag 必须是 sha-<commit>"; exit 1 ;; esac
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras manifest fetch "$BUNDLE_REPO:$TAG" >/dev/null || { echo "::error::$BUNDLE_REPO:$TAG 不存在"; exit 1; }
          oras tag "$BUNDLE_REPO:$TAG" main
          echo "rev=${TAG#sha-}" >> "$GITHUB_OUTPUT"
          echo "回滚：:main → \`$TAG\`（数据库不回滚）" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: 公网 health 校验
    needs: [bundle, rollback]
    if: always() && (needs.bundle.result == 'success' || needs.rollback.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: 等待服务器切到新版本
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          EXPECTED: ${{ needs.bundle.outputs.rev || needs.rollback.outputs.rev }}
        # updater 每 60s 检查一次 :main，加上拉取和重启，正常 2–3 分钟内完成。
        # 只看 200 不能证明新代码起来了，必须断言 version。缺 API_PUBLIC_URL 直接失败，不静默跳过。
        run: |
          set -euo pipefail
          if [ -z "$API_PUBLIC_URL" ]; then
            echo "::error::未配置 GitHub Variable API_PUBLIC_URL，无法校验公网 health（见 deploy/ENV.md）"
            exit 1
          fi
          deadline=$(( $(date +%s) + 600 ))
          reported=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body="$(curl --silent --max-time 10 "$API_PUBLIC_URL/health" || true)"
            reported="$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "$reported" = "$EXPECTED" ]; then
              echo "version 断言通过：$reported"
              echo "公网 health: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "当前 version=${reported:-无响应}，等待 $EXPECTED"
            sleep 15
          done
          echo "::error::10 分钟内公网 /health 没有切到 $EXPECTED（最后一次: ${reported:-无响应}）。服务器上查看: pm2 logs updater / pm2 logs agent-api"
          exit 1
