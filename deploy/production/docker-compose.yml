# CoResearch 生产 Compose —— 只在服务器 /srv/coresearch/app/ 下运行。
#
# 这个文件由 GitHub Actions 每次部署时 scp 覆盖，服务器上不保留源码、不需要 git、不需要 Node。
# 镜像来自 GHCR，绝不在生产机上构建。
#
# 三条硬约束：
#   1. agent-api 必须单副本。RuntimeManager 的 AbortController、CanvasBridge 的待确认画布工具调用、
#      EventHub 的 SSE 订阅者全在进程内存里，多副本会让 abort 和画布工具投递到错误的实例。
#   2. 用 network_mode: host。这台机器的 Docker bridge 没有出站 DNS/egress，Pi provider 调不通。
#      代价是 ports: 不生效，容器直接监听宿主机 4100；公网入口由 Cloudflare Tunnel 从 127.0.0.1 接。
#   3. 密钥只来自 /srv/coresearch/env/production.env，不写进本文件、不进镜像、不进 Git。

services:
  agent-api:
    image: ghcr.io/zhanghoks/coresearch-agent-api:${IMAGE_TAG:-main}
    container_name: coresearch-agent-api
    env_file:
      - /srv/coresearch/env/production.env
    network_mode: host
    volumes:
      # bind mount 而不是 named volume：数据位置在宿主机上显式可见、可直接 tar 备份，
      # 且 docker compose down -v 不可能把它删掉。
      - /srv/coresearch/data/pi:/var/lib/research-canvas/pi
      # 预留：AGENT_RUNTIME=codex 时的 per-project workspace。当前 pi 运行时不使用。
      - /srv/coresearch/data/runtime:/srv/coresearch/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||4100)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cloudflared:
    # 固定版本，不用 :latest —— agent-api 靠 sha- tag 做秒级回滚，如果 cloudflared 用 :latest，
    # 回滚 agent-api 时 cloudflared 可能悄悄换了个新版本，两者就不再对应同一次验证过的组合。
    # 升级时手动把这个 tag 提上去，同样走 git push 走一遍 CI/CD。
    image: cloudflare/cloudflared:2026.9.1
    container_name: coresearch-cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    network_mode: host
    volumes:
      - /etc/cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    depends_on:
      - agent-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── app：备用静态前端（可选，默认不启用）─────────────────────────────────────
  # 主站走 Vercel。这个容器只是 Vercel 不可用时的兜底入口，通过
  # deploy/cloudflared/config.yml 里的 app-internal.coresearch.xxx.com 暴露。
  # 启用方式：COMPOSE_PROFILES=app /srv/coresearch/app/deploy.sh
  # 没有这个 profile 时它完全不会被创建。注意它只监听回环，不要把主域名指到这里。
  app:
    image: ghcr.io/zhanghoks/coresearch:${WEB_IMAGE_TAG:-latest}
    container_name: coresearch-web
    profiles: ["app"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 这三个是浏览器所需的公开值，由 web/docker-entrypoint.sh 写进运行时 config.js。
      # 不要在这里放 PI_API_KEY 之类的服务端凭据。
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      AGENT_API_URL: ${AGENT_API_URL:-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # agent-worker 预留方案（现在拆不出来，原因和未来落地方式）完整写在
  # deploy/production/README.md「已知边界 §3」，不在这里放一份注释代码——
  # 这段 YAML 永远不会真的被取消注释就直接可用（还缺共享事件通道和 durable run state），
  # 放在这里只是文档，属于 dead code，交给 README 说清楚就够了。
